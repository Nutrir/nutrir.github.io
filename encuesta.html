<!DOCTYPE html>
<html ng-app="formApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta Panza Llena</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Roboto', sans-serif; /* Fuente más legible para formularios */
    }
    .container {
      max-width: 500px;
      padding: 20px;
    }
    h2 {
      color: #5c3d2e;
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
      font-family: 'Dancing Script', cursive; /* Mantenemos cursiva solo en títulos */
    }
    .form-container {
      background-color: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .btn-submit {
      background-color: #a0522d;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .btn-submit:hover {
      background-color: #8b4513;
    }
    .form-label {
      font-weight: 600;
      color: #5c3d2e;
      margin-bottom: 8px;
    }
    .form-control, .form-select {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    .mensaje {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #f8e8e0;
    }
    .mensaje a {
      color: #a0522d;
      text-decoration: underline;
      font-weight: 600;
    }
    .mensaje a:hover {
      color: #8b4513;
    }
  </style>
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body ng-controller="FormController">
  <div class="container mt-4 mb-5">
    <h2>¡Tu opinión nos importa!</h2>
    
    <div class="form-container">
      <form ng-submit="submitForm()">
        <!-- Datos personales -->
        <div class="mb-3">
          <label class="form-label">Nombre completo:</label>
          <input type="text" class="form-control" ng-model="formData.nombre" required placeholder="Ingrese su nombre">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Teléfono:</label>
          <input type="tel" class="form-control" ng-model="formData.telefono" required placeholder="Ej: +56912345678">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Email:</label>
          <input type="email" class="form-control" ng-model="formData.email" required placeholder="Ej: nombre@email.com">
        </div>
        
        <!-- Valoración -->
        <div class="mb-3">
          <label class="form-label">¿Qué te pareció la comida?</label>
          <select class="form-select" ng-model="formData.valoracion_comida" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="Excelente">⭐ Excelente</option>
            <option value="Muy buena">👍 Muy buena</option>
            <option value="Buena">😊 Buena</option>
            <option value="Regular">🤔 Regular</option>
            <option value="Mala">👎 Mala</option>
          </select>
        </div>
        
        <div class="mb-4">
          <label class="form-label">¿Cómo fue el servicio?</label>
          <select class="form-select" ng-model="formData.valoracion_servicio" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="Excelente">⭐ Excelente</option>
            <option value="Muy bueno">👍 Muy bueno</option>
            <option value="Bueno">😊 Bueno</option>
            <option value="Regular">🤔 Regular</option>
            <option value="Malo">👎 Malo</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary btn-submit">Enviar encuesta</button>
        
        <!-- Mensaje de confirmación con link -->
        <div class="mensaje mt-3" ng-if="mensaje">
          {{ mensaje }}<br><br>
          <a href="menu.html">Ver nuestro menú</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    angular.module('formApp', [])
    .controller('FormController', function($scope, $http) {
      $scope.formData = {};
      $scope.mensaje = "";

      $scope.submitForm = function() {
      const url = "https://script.google.com/macros/s/AKfycbyl0fMfeflzElIohZ-hYpFfDZxB-OIZEv9jZgBeYFZJIzwlap2BsNf82zg_SqLja2QNXQ/exec";

        const data = new URLSearchParams();
        data.append("nombre", $scope.formData.nombre);
        data.append("telefono", $scope.formData.telefono);
        data.append("email", $scope.formData.email);
        data.append("valoracion_comida", $scope.formData.valoracion_comida);
        data.append("valoracion_servicio", $scope.formData.valoracion_servicio);

        $http({
          method: 'POST',
          url: url,
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          data: data.toString()
        }).then(function success() {
          $scope.mensaje = "¡Gracias por tu opinión! Te esperamos pronto con tu café o postre de cortesía.";
          $scope.formData = {};
        }, function error() {
          $scope.mensaje = "Ocurrió un error al enviar. Por favor intenta nuevamente.";
        });
      };
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
