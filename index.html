<!DOCTYPE html>
<html ng-app="formApp">
<head>
  <meta charset="UTF-8">
  <title>Formulario a Google Sheets</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="FormController">
  <div class="container mt-5">
    <h2>Enviar datos a Google Sheets</h2>
    <form ng-submit="submitForm()" class="mt-4">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" class="form-control" ng-model="formData.nombre" required>
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" class="form-control" ng-model="formData.email" required>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
      <p class="mt-3" ng-if="mensaje">{{ mensaje }}</p>
    </form>
  </div>

  <script>
    angular.module('formApp', [])
    .controller('FormController', function($scope, $http) {
      $scope.formData = {};
      $scope.mensaje = "";

      $scope.submitForm = function() {
        const url = "https://script.google.com/macros/s/AKfycbycSnjYV9xiKjmNLsBxqILdE3HURCWBqFPYNxZ_sWhjK2egaevwbLJo3Sbl2fbQ5yZybA/exec"; // Pegá aquí la URL del Web App de Apps Script

        const data = new URLSearchParams();
        data.append("nombre", $scope.formData.nombre);
        data.append("email", $scope.formData.email);

        $http({
          method: 'POST',
          url: url,
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          data: data.toString()
        }).then(function success() {
          $scope.mensaje = "Datos enviados con éxito.";
          $scope.formData = {};
        }, function error() {
          $scope.mensaje = "Error al enviar los datos.";
        });
      };
    });
  </script>
</body>
</html>
